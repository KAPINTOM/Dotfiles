#[window]
# Starts Alacritty in maximized mode
#startup_mode = "Maximized"

[font]
size = 9.0

# Set default font style to Bold
[font.normal]
family = "monospace"
style = "Bold"

[font.bold]
family = "monospace"
style = "Bold"

[colors.primary]
# Rich dark orange background
background = "#000000"
# Bright white foreground/font color
#foreground = "#FFFFFF"

#[colors.cursor]
#cursor = "#FFFFFF"
#text = "#8B4000"

#[colors.selection]
#text = "#8B4000"
#background = "#FFFFFF"

# Normal colors setup to maintain white/bright text across terminal applications
